<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Kino & Filmlar Olami | Online Cinema</title>
  
  <!-- SEO & OpenGraph -->
  <meta name="description" content="Eng sara premyeralar, mashhur kinolar va treylerlarni yuqori sifatda tomosha qiling." />
  <meta property="og:title" content="Kino & Filmlar Olami | Online Cinema" />
  <meta property="og:description" content="Eng sara premyeralar, mashhur kinolar va treylerlarni yuqori sifatda tomosha qiling." />
  <meta property="og:type" content="website" />
  <meta property="og:image" content="https://images.unsplash.com/photo-1536440136628-849c177e76a1?auto=format&fit=crop&w=1200&q=80" />
  <meta name="theme-color" content="#0a0d14" />

  <!-- Telegram WebApp Script -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <!-- Stylesheet -->
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <!-- Site Header -->
  <header class="site-header">
    <div class="container header-inner">
      <a href="#" class="brand-logo" onclick="location.reload(); return false;">
        <div class="brand-icon">
          <svg viewBox="0 0 24 24">
            <path d="M18 4l2 4h-3l-2-4h-2l2 4h-3l-2-4H8l2 4H7L5 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V4h-4z"/>
          </svg>
        </div>
        <span>KINO<span style="color: var(--accent-red);">PLUS</span></span>
        <span class="brand-badge">HD</span>
      </a>

      <!-- Search Input -->
      <div class="search-wrapper">
        <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
        <input 
          type="text" 
          id="searchInput" 
          class="search-input" 
          placeholder="Kino, janr yoki rejissyor nomi..." 
          autocomplete="off"
        />
      </div>

      <!-- Header Actions -->
      <div class="header-actions">
        <button class="icon-btn" id="favToggleBtn" title="Saqlangan kinolar">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/>
          </svg>
          <span class="btn-badge" id="favBadge" style="display: none;">0</span>
        </button>
      </div>
    </div>
  </header>

  <!-- Main Content -->
  <main class="container">

    <!-- Hero Banner Showcase -->
    <section class="hero-section" id="heroSection">
      <!-- Injected by app.js -->
    </section>

    <!-- Controls Bar (Genres & Sort) -->
    <section class="controls-bar">
      <div class="genre-chips" id="genreChips">
        <!-- Injected by app.js -->
      </div>

      <div class="sort-wrapper">
        <select class="sort-select" id="sortSelect">
          <option value="featured">🔥 Tavsiya etilganlar</option>
          <option value="rating">★ Reyting bo'yicha</option>
          <option value="year">📅 Yil bo'yicha</option>
          <option value="title">🔤 Nomi bo'yicha (A-Z)</option>
        </select>
      </div>
    </section>

    <!-- Movies Grid Header -->
    <div class="section-header">
      <h2 class="section-title">Kinolar to'plami</h2>
      <span style="color: var(--text-muted); font-size: 13px;" id="moviesCount">8 ta kino</span>
    </div>

    <!-- Movies Grid -->
    <section class="movies-grid" id="moviesGrid">
      <!-- Injected by app.js -->
    </section>

  </main>

  <!-- Movie Details Modal -->
  <div class="modal-backdrop" id="detailModal">
    <div class="modal-dialog">
      <button class="modal-close-btn" id="detailCloseBtn">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>

      <div class="detail-banner" id="detailBanner">
        <div class="detail-banner-gradient"></div>
      </div>

      <div class="detail-body">
        <div class="detail-header">
          <div>
            <h2 class="detail-title" id="detailTitle">Kino Nomi</h2>
            <div class="detail-meta" id="detailMeta"></div>
          </div>
          <div style="display: flex; gap: 8px;">
            <button class="icon-btn" id="detailShareBtn" title="Ulashish">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="18" cy="5" r="3"></circle>
                <circle cx="6" cy="12" r="3"></circle>
                <circle cx="18" cy="19" r="3"></circle>
                <line x1="8.59" y1="13.51" x2="15.42" y2="17.49"></line>
                <line x1="15.41" y1="6.51" x2="8.59" y2="10.49"></line>
              </svg>
            </button>
          </div>
        </div>

        <p class="detail-desc" id="detailDesc"></p>

        <div style="margin-bottom: 24px;">
          <button class="btn-primary" id="detailPlayBtn" style="width: 100%; justify-content: center;">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
              <path d="M8 5v14l11-7z"/>
            </svg>
            Treyler / Filmni boshlash
          </button>
        </div>

        <div class="detail-meta-grid">
          <div class="detail-meta-row">
            <strong>Rejissyor</strong>
            <span id="detailDirector">-</span>
          </div>
          <div class="detail-meta-row">
            <strong>Bosh rollarda</strong>
            <span id="detailCast">-</span>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Video Player Modal -->
  <div class="modal-backdrop" id="playerModal">
    <div class="modal-dialog player-dialog">
      <button class="modal-close-btn" id="playerCloseBtn">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>

      <div class="video-container" id="videoWrapper">
        <!-- Injected by app.js -->
      </div>
    </div>
  </div>

  <!-- Site Footer -->
  <footer class="site-footer">
    <div class="container footer-inner">
      <div>
        <p>© 2026 <strong>KinoPlus</strong>. Barcha huquqlar himoyalangan.</p>
        <p style="font-size: 11px; margin-top: 4px; color: var(--text-muted);">
          Vercel & Telegram Mini App uchun optimallashtirilgan yengil va tezkor kino portali.
        </p>
      </div>
      <div>
        <span class="brand-badge">Vercel Ready</span>
      </div>
    </div>
  </footer>

  <!-- Scripts -->
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
